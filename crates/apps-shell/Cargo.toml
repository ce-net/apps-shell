[package]
name = "apps-shell"
version = "0.1.0"
description = "The apps.shell cell: apps.ce-net.com's tab bar computed per viewer, and its gateway face for the Approvals and Core tabs"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "apps-shell"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
apps-shell-api = { path = "../apps-shell-api" }
ce-net-net = { workspace = true }
approve-inbox-api = { workspace = true }
site-cellmap-api = { workspace = true }
foreman-shell-api = { workspace = true }
cr-shell-api = { workspace = true }
ui-chain = { workspace = true }
site-gateway = { workspace = true }
ce-wire = { workspace = true, features = ["server", "client"] }
ce-gate = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"
