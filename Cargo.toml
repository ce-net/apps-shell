[workspace]
resolver = "2"
members = ["crates/apps-shell-api", "crates/apps-shell"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
ce-wire = { git = "https://github.com/Leif-Rydenfalk/rust-stack", rev = "d283bd528f96effabcf4dec56eb4fad1bec08d27" }
ce-gate = { git = "https://github.com/Leif-Rydenfalk/rust-stack", rev = "d283bd528f96effabcf4dec56eb4fad1bec08d27" }
ui-chain = { git = "https://github.com/ce-net/ui-cells", rev = "103703220a8554d07af1ed6a1eea5ef0e5a72090" }
site-gateway = { git = "https://github.com/ce-net/ui-cells", rev = "103703220a8554d07af1ed6a1eea5ef0e5a72090" }
ce-net-net = { git = "https://github.com/ce-net/ce-net-net", rev = "34032d77bbe6521d85982bd63bb22e579e889023" }
# the ce-net browser: open.with (which view opens a ce-ref for this viewer) and home.shell (Home's layout)
open-with-api = { git = "https://github.com/ce-net/open-with", rev = "595aebda99982223d0c51925792a64e478f0a660" }
home-shell-api = { git = "https://github.com/ce-net/home-shell", rev = "a2ee8813e2eccddbd3428c7c8004ec1ff0182668" }
# the tab shells and data cells, pinned by commit (this site's cell.lock)
approve-inbox-api = { git = "https://github.com/ce-net/approve-inbox", rev = "6d931c830ce6406325d786ce457c83b013314adf" }
site-cellmap-api = { git = "https://github.com/ce-net/site-cellmap", rev = "db2468894150662ca466e60cb4e523d39e74d0d8" }
foreman-shell-api = { git = "https://github.com/ce-net/foreman-shell", rev = "9afec161131287aaf21881e54c92595276441659" }
cr-shell-api = { git = "https://github.com/ce-net/control-room", rev = "29d6982a1b89e966ad7f9d488eb383a3f7f970b9" }
# the Now and Business monitor tabs' shells (ce-net-net NOW, BUSINESS): person.now@1 and business.view (render:html)
person-now-api = { git = "https://github.com/Leif-Rydenfalk/person-now", rev = "c1279b632c2b06e19d13faf2017c05435de76e4d" }
business-monitor-api = { git = "https://github.com/Leif-Rydenfalk/business-monitor", rev = "e7e671571e17e9a07ef783055224fbd85f106487" }

[profile.release]
lto = "thin"
codegen-units = 16
